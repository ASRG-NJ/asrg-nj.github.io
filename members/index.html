<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Members | ASRG</title>
<meta name="description" content="Air Structure Research Group">
<link rel="preload" as="image" href="/assets/asrg-logo.png">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<div class="site">
<header class="header">
  <button class="menu-button" aria-label="Open navigation" aria-expanded="false" data-menu-button>☰</button>
  <a class="brand" href="/" aria-label="ASRG home">ASRG</a>
  <nav class="nav" aria-label="Primary navigation"><a class="" href="/about/">About</a><a class="" href="/resources/">Resources</a><a class="" href="/contact/">Contact</a><a class="active" href="/members/">Members</a></nav>
  <nav class="mobile-menu" aria-label="Mobile navigation" data-mobile-menu><a href="/about/">About</a><a href="/resources/">Resources</a><a href="/contact/">Contact</a><a href="/members/">Members</a></nav>
</header>
<main class="main">
  <section class="logo-panel" aria-label="Air Structure Research Group logo"><img src="/assets/asrg-logo.png" alt="Air Structure Research Group"></section>
  <div class="divider" aria-hidden="true"></div>
  <section class="content-panel"><div class="content"><div class="login-wrap">
<h1>Members</h1>
<form class="login-card" data-signin-form novalidate>
  <div class="login-title">Sign In</div>
  <label class="visually-hidden" for="user">Email or username</label>
  <div class="field"><input id="user" name="user" autocomplete="username" placeholder="Email or username"></div>
  <label class="visually-hidden" for="password">Password</label>
  <div class="field"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password"></div>
  <button class="signin" type="submit">Sign In</button>
  <button class="forgot" type="button" data-forgot>Forgot password?</button>
  <div class="error" data-login-error></div>
</form>
</div></div></section>
</main>
</div>
<script src="/assets/site.js"></script>
</body>
</html>
