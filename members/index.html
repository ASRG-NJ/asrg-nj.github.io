<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ASRG-NJ Members</title>
<link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="wrap">

  <div class="left">
    <img src="/IMG_9075.jpeg" alt="ASRG-NJ Logo">
  </div>

  <div class="right">

    <h1>Member Access</h1>

    <form id="loginForm">

      <input
        type="text"
        placeholder="Username"
        required
      >

      <input
        type="password"
        placeholder="Password"
        required
      >

      <button type="submit">
        Sign In
      </button>

    </form>

    <div id="error"></div>

  </div>

</div>

<script src="/login.js"></script>

</body>
</html>
